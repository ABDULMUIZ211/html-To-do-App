<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="phone">

  <div class="status-bar"> 
         <div class="status-icons">
        <span id="clock">12:00</span>

    <!-- Signal -->
             <span class="signal">
           <i></i><i></i><i></i><i></i>
           </span>


    <!-- WiFi -->
    <svg class="wifi-icon" viewBox="0 0 24 24"
         fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round">
        <path d="M2 8.5C7.5 3.5 16.5 3.5 22 8.5"/>
        <path d="M5.5 12C9 9 15 9 18.5 12"/>
        <path d="M9 15.5C11 14 13 14 15 15.5"/>
        <circle cx="12" cy="19" r="1" fill="currentColor"/>
    </svg>

    <!-- Battery -->
    <svg class="battery-icon" viewBox="0 0 32 18"
         fill="none" stroke="currentColor"
         stroke-width="1.8">
        <rect x="1" y="2" width="26" height="14" rx="3"/>
        <rect x="28" y="6" width="3" height="6" rx="1" fill="currentColor"/>
        <rect x="4" y="5" width="19" height="8" rx="1"
              fill="currentColor" stroke="none"/>
    </svg>

</div>
  </div>

        
    
  <header class="top">
      <h1>My Tasks</h1>
      <button id="refreshBtn">&#8635;</button>
  </header>

  <div class="search">
    <input id="searchInput" placeholder="Search your tasks">
  </div>

  <ul id="taskList"></ul>

  <p id="emptyMsg" class="hidden">Nothing yet.</p>

  <button id="newBtn" class="fab">+ New Task</button>

  <div id="modal" class="modal hidden">

    <div class="sheet">
        <h2 id="modalTitle">New Task</h2>

        <input id="titleInput" placeholder="Task title">

       <textarea id="noteInput"></textarea>

        <button id="cancelBtn">Cancel</button>

        <button id="saveBtn">Save</button>
    </div>

  </div>
</main>


</body>
<script src="script.js"></script>
</html>
